name: Source publication request validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'content/publications/**'
permissions:
  contents: read
concurrency:
  group: publication-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  validate-request:
    if: startsWith(github.event.pull_request.head.ref, 'source/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2 Pillow==11.3.0
      - name: Validate immutable data-only request with trusted base code
        run: python scripts/publication_request.py --validate-pr
