name: Temporary Akkar editorial build and validation
on:
  push:
    branches: [publish/akkar-sparrowhawk-20261012]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editorial renderer dependencies
        run: pip install lxml==5.3.2
      - name: Generate Akkar and all three language listings from approved sources
        run: python scripts/publish_akkar_sparrowhawk_20261012.py
      - name: Build archive catalog cross-references
        run: |
          python audit/image-catalog/search_all.py --audit --check-files
          python audit/image-catalog/build_preliminary_taxonomy.py
          python audit/image-catalog/link_historical_articles.py
          python audit/image-catalog/verify_catalog.py
      - name: Verify protected publication contract and multilingual cards
        run: |
          base="$(git merge-base HEAD origin/main)"
          python scripts/check_publication_contract.py --base "$base"
          python scripts/test_homepage_doors.py
      - name: Verify shared tickers and head/analytics/SEO
        run: |
          python scripts/test_shared_ticker.py
          python scripts/test_seo_foundation.py
          python scripts/test_hreflang_contract.py
          python scripts/repair_ga4_tracking.py --check
      - name: Verify media and archive
        run: |
          python scripts/test_archive_media_contract.py
          python scripts/test_archive_access.py
      - name: Save tested publication result in branch (no main publication yet)
        run: |
          git config user.name "sayd-editorial-bot"
          git config user.email "sayd-editorial-bot@users.noreply.github.com"
          git add -A
          git diff --cached --stat | tail -20
          if git diff --cached --quiet; then
            echo "No generated changes"; exit 1
          fi
          git commit -m "Render approved Akkar story to three pages, Updates, hunting and shared ticker"
          git push origin HEAD:publish/akkar-sparrowhawk-20261012
