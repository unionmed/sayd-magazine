name: Build and review Omayed cooperation article
on:
  push:
    branches: [news/egypt-uae-omayed-20261018]
  pull_request:
    paths: ['content/features/egypt-uae-omayed-20261018.json', 'scripts/*egypt_uae_omayed*', '.github/workflows/omayed-build-20261018.yml']
permissions:
  contents: read
jobs:
  build:
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, '[omayed-built]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Render and check the authorized article
        run: |
          python scripts/publish_egypt_uae_omayed_20261018.py
          python scripts/test_egypt_uae_omayed_20261018.py
          python scripts/check_publication_contract.py --base dcdd205015072065e93c6278c01c457f76e75ea7
          python scripts/test_homepage_doors.py
          python scripts/test_shared_ticker.py
          python scripts/test_hreflang_contract.py
          python scripts/test_archive_media_contract.py
          python scripts/test_archive_access.py
          python scripts/test_egypt_uae_omayed_browser_20261018.py
      - name: Commit verified output to the article review branch
        run: |
          git config user.name 'Sayd publication checks'
          git config user.email 'actions@users.noreply.github.com'
          git add docs content audit/image-catalog/manifest/2026-01.tsv
          if ! git diff --cached --quiet; then
            git commit -m 'Render Omayed cooperation story in AR/EN/FR [omayed-built]'
            git push origin HEAD:news/egypt-uae-omayed-20261018
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omayed-build-review-${{ github.run_id }}
          path: sayd-visual-qa/omayed-20261018/
          retention-days: 30
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_egypt_uae_omayed_20261018.py
      - run: python scripts/test_egypt_uae_omayed_browser_20261018.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omayed-final-review-${{ github.run_id }}
          path: sayd-visual-qa/omayed-20261018/
          retention-days: 30
