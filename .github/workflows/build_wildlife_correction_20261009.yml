name: Build wildlife door corrections
on:
  push:
    branches:
      - fix/wildlife-dates-categories-20261009
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[wildlife-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct AR/EN/FR taxonomy and homepage from authoritative sources
        run: |
          python -m pip install lxml
          python scripts/fix_wildlife_door_20261009.py
          python scripts/check_publication_contract.py --base origin/main
          python scripts/test_homepage_doors.py
      - name: Preserve generated pages, sources and regression checks
        run: |
          git config user.name "sayd-publication-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs content scripts
          if ! git diff --cached --quiet; then
            git commit -m "[wildlife-generated] Restore date order and coastal-birds category"
            git push origin HEAD:fix/wildlife-dates-categories-20261009
          fi
