name: Refresh approved header CSS URLs
on:
  push:
    branches: [fix/header-css-cache-version-20261017]
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[header-version-built]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2
      - name: Change only the two header CSS query versions
        run: |
          python scripts/refresh_header_asset_versions.py
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from scripts.refresh_header_asset_versions import refresh
          for f in filter(None,subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')):
              assert f.startswith('docs/') and f.endswith('.html'), f
              old=subprocess.check_output(['git','show','HEAD:'+f]).decode()
              assert refresh(old)==Path(f).read_text(), f
          PY
          python scripts/check_publication_contract.py --base b03809725d80f06b51522a5f41d3e57bcb172e86
          python scripts/test_homepage_doors.py
      - name: Commit exact cache version refresh to review branch
        run: |
          git config user.name 'Sayd website quality checks'
          git config user.email 'actions@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh header asset URLs without content changes [header-version-built]'
            git push origin HEAD:fix/header-css-cache-version-20261017
          fi

