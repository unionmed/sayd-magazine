name: Build approved Saudi Touqi article
on:
  push:
    branches:
      - publish/saudi-touqi-birds-20261009
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[saudi-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare complete AR/EN/FR website package
        run: |
          python -m pip install lxml
          python scripts/publish_saudi_touqi.py
          python scripts/check_publication_contract.py --base origin/main
          python scripts/test_homepage_doors.py
      - name: Commit generated local photos and website pages to review branch
        run: |
          git config user.name "sayd-publication-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content docs notes
          if ! git diff --cached --quiet; then
            git commit -m "[saudi-generated] Build approved Touqi article and local photographs"
            git push origin HEAD:publish/saudi-touqi-birds-20261009
          fi
