name: Build approved Shireen revision
on:
  push:
    branches: [fix/shireen-revision-20261018]
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[shireen-revised]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2
      - name: Apply bounded approved revision
        run: |
          python scripts/revise_shireen_interview_20261018.py
          python scripts/check_publication_contract.py --base a24861848120fe4f8678b7a1b0ba92de6396567a
          python scripts/test_homepage_doors.py
          python scripts/build_search_index.py --check
      - name: Commit generated revision
        run: |
          git config user.name 'Sayd publication checks'
          git config user.email 'actions@users.noreply.github.com'
          git add docs content audit/image-catalog/manifest/2026-01.tsv
          if ! git diff --cached --quiet; then
            git commit -m 'Apply approved Shireen corrections in three languages [shireen-revised]'
            git push origin HEAD:fix/shireen-revision-20261018
          fi
