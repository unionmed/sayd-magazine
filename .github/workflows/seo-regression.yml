name: Sayd SEO regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seo:
    name: SEO and analytics regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2
      - run: python scripts/test_seo_foundation.py
      - run: python scripts/test_hreflang_contract.py
      - run: python scripts/repair_ga4_tracking.py --check
