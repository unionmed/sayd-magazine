name: Apply GA4 tracking

on:
  push:
    branches: [main, fix/ga4-verified-measurement-id]
    paths:
      - "scripts/seo_foundation.py"
      - "scripts/repair_ga4_tracking.py"
      - "scripts/analytics_only_change.py"
      - ".github/workflows/apply-ga4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga4-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publication-test dependency
        run: pip install lxml==5.3.2
      - name: Validate SEO before analytics repair
        run: python3 scripts/test_seo_foundation.py
      - name: Verify exact instrumentation-only change recognition
        run: python3 scripts/analytics_only_change.py --install
      - name: Repair only GA4 blocks and the generator
        run: |
          python3 scripts/repair_ga4_tracking.py
          python3 scripts/repair_ga4_tracking.py --check
      - name: Preserve all required publication and archive gates
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/check_publication_contract.py --base "$BASE_SHA"
          python3 scripts/test_homepage_doors.py
          python3 scripts/test_archive_media_contract.py
          python3 scripts/test_archive_access.py
      - name: Require all SEO regressions and language alternates to pass
        run: |
          python3 scripts/test_seo_foundation.py
          python3 scripts/test_hreflang_contract.py
      - name: Prepare verified analytics-only patch for PR review
        id: patch
        run: |
          git add scripts/seo_foundation.py scripts/check_publication_contract.py
          git add -- ':(glob)docs/**/*.html'
          if git diff --cached --quiet; then
            echo "GA4 is already correct; no changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary > "$RUNNER_TEMP/ga4-tracking.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Verified GA4 changes require a reviewed PR; main is never pushed directly." >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified patch for a reviewed PR
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ga4-tracking-patch
          path: ${{ runner.temp }}/ga4-tracking.patch
          if-no-files-found: error
          retention-days: 14
