name: Apply GA4 tracking

on:
  push:
    branches: [main]
    paths:
      - "scripts/seo_foundation.py"
      - ".github/workflows/apply-ga4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply shared SEO and analytics tags
        run: python3 scripts/seo_foundation.py
      - name: Commit generated HTML
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Apply GA4 tracking to published pages"
          git push
