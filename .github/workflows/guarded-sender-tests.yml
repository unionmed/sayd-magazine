name: Guarded sender integration tests (no provider sends)
on:
  pull_request:
    paths:
      - 'scripts/guarded_social_sender.py'
      - 'scripts/test_guarded_social_sender.py'
      - 'scripts/publication_gate.py'
      - 'scripts/test_publication_gate.py'
      - '.github/workflows/guarded-sender-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2
      - run: python -m unittest discover -s scripts -p test_publication_gate.py -v
      - run: python -m unittest discover -s scripts -p test_guarded_social_sender.py -v
