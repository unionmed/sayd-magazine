name: Sayd publication contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  three-mirror:
    name: Three-mirror publication check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2
      - name: Enforce design, slots, social channels and three languages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}"; then
            python scripts/check_publication_contract.py --base "$base"
          else
            python scripts/check_publication_contract.py
          fi
      - run: python scripts/test_homepage_doors.py
      - run: python scripts/test_archive_media_contract.py
      - run: python scripts/test_archive_access.py
