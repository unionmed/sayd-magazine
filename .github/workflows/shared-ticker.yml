name: Shared news ticker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml
      - run: python scripts/test_shared_ticker.py
