name: Shared news ticker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml
      - run: python scripts/test_shared_ticker.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_shared_ticker_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-ticker-responsive-${{ github.run_id }}
          path: sayd-visual-qa/ticker/
          retention-days: 30
