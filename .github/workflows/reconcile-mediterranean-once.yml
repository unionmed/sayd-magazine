name: Reconcile Mediterranean warning with current main
on:
  push:
    branches: [publish/mediterranean-european-warning-20261012]
    paths: [.github/workflows/reconcile-mediterranean-once.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2
      - name: Merge current main with existing correction preserved
        run: |
          git config user.name "Sayd editorial automation"
          git config user.email "unionmedia.sarl@gmail.com"
          git fetch origin main
          git merge -X theirs --no-commit --no-ff origin/main
      - name: Complete new article's mirrored archives and categories
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          root=Path('docs')
          slug='european-warning-11-36-million-birds-mediterranean'
          image='bekaa-illegal-nets-adonis-20261001-archive.jpg'
          info={
            'en':{'title':'European warning: 11–36 million birds illegally killed or captured annually in the Mediterranean','date':'12 October 2026','desc':'European conservation organisations recall the 11–36 million annual estimate and call for effective measures on Mediterranean flyways.','label':'Illegal nets in the Bekaa; Sayd archive, 1 October 2026.'},
            'fr':{'title':'Alerte européenne : 11 à 36 millions d’oiseaux tués ou capturés illégalement en Méditerranée','date':'12 octobre 2026','desc':'Des organisations européennes rappellent une estimation de 11 à 36 millions d’oiseaux par an et appellent à renforcer la protection des voies migratoires.','label':'Filets illégaux dans la Bekaa ; archives Sayd, 1er octobre 2026.'}
          }
          for lang,labels in info.items():
            for section,path in [('archive',root/lang/('stories/index.html')),('category',root/lang/'category/صيد/index.html')]:
              txt=path.read_text(encoding='utf-8')
              position=txt.index('<main')
              body=txt[position:]
              article_uri=slug+'/index.html'
              if article_uri in body:
                continue
              if section=='archive':
                sep='<div class="grid-4">' if lang=='en' else '<div class="home-door-grid">'
                href='../posts/'+article_uri
                img='../../media/uploads/2026/10/'+image
                klass='card'
              else:
                sep=('<div class="home-door-grid">' if lang=='fr' else '<div class="post-list">')
                href='../../posts/'+article_uri
                img='../../../media/uploads/2026/10/'+image
                klass='post-row' if lang=='en' else 'card'
              assert sep in body,(lang,section,'listing missing')
              esc=lambda x:html.escape(x,quote=True)
              card=(f'<article class="{klass}"><a class="thumb" href="{href}"><img src="{img}" alt="{esc(labels["label"])}" loading="lazy"></a>'
                f'<div class="body"><h2><a href="{href}">{esc(labels["title"])}</a></h2><div class="meta">{esc(labels["date"])}</div><p class="excerpt">{esc(labels["desc"])}</p></div></article>')
              body=body.replace(sep,sep+'\n'+card+'\n',1)
              path.write_text(txt[:position]+body,encoding='utf-8')
              print(lang,section,'European report listed')
          PY
      - name: Regenerate approved homepage, SEO, URLs and every internal ticker
        run: |
          python scripts/refresh_homepage_doors.py
          python scripts/seo_foundation.py
          python scripts/sync_tickers.py
          python scripts/short_links.py
      - name: Limit existing article updates to shared ticker only
        run: |
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','-z','origin/main','--','docs']).decode().split('\0')
          restored=0
          for p in paths:
            if not p.startswith('docs/') or '/posts/' not in p or not p.endswith('/index.html'):continue
            if 'تحذير-أوروبي-11-36-مليون-طائر-في-المتوسط' in p or 'european-warning-11-36-million-birds-mediterranean' in p:continue
            present=subprocess.run(['git','cat-file','-e','origin/main:'+p],stderr=subprocess.DEVNULL).returncode==0
            if present:
              subprocess.run(['git','restore','--source','origin/main','--',p],check=True)
              restored+=1
          print('Restored existing article bodies before ticker sync:',restored)
          PY
          python scripts/sync_tickers.py
      - name: Enforce three-language publication and all SEO safeguards
        run: |
          python scripts/check_publication_contract.py --base origin/main
          python scripts/test_homepage_doors.py
          python scripts/test_shared_ticker.py
          python scripts/test_seo_foundation.py
          python scripts/test_hreflang_contract.py
      - name: Commit verified changes and remove this temporary workflow
        run: |
          git rm .github/workflows/reconcile-mediterranean-once.yml
          git add -A
          git commit -m "Finalize European bird warning with three-language archive and shared tickers"
          git push origin HEAD:publish/mediterranean-european-warning-20261012
